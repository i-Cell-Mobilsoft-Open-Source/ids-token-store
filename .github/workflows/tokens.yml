name: Token Pipeline

# Shared scripts implement parsing, validation and publishing on both CI platforms.
# Push generates CSS only; workflow_dispatch selects exactly one manual operation.

on:
  push:
    paths:
      - 'foundations/**'
      - 'components/**'
      - 'parse_ids_css.ts'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/tokens.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Choose an operation: generate CSS, validate tokens, or publish CSS.'
        required: true
        type: choice
        default: generate
        options:
          - generate
          - validate
          - publish
      target_repo_url:
        description: 'Publish only: HTTPS repository URL, without credentials. Leave empty to use TARGET_REPO_URL.'
        required: false
        type: string
      ids_styles_ref:
        description: 'Token validation only: Select the ids-styles branch, tag or commit SHA to compare against the generated tokens. Leave empty to use IDS_STYLES_REF. Does not affect publishing.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # ── parse ────────────────────────────────────────────────────────────────
  parse_tokens:
    name: Generate CSS
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Parse design tokens
        run: npm run parse

      - name: Commit generated CSS back to source branch
        env:
          CI_COMMIT_BRANCH: ${{ github.ref_name }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_COMMIT_REF_PROTECTED: ${{ github.ref_type != 'branch' || github.ref_protected }}
          CI_REPOSITORY_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          SELF_COMMIT_MESSAGE: 'chore(tokens): update generated CSS [skip ci]'
        run: bash scripts/commit-generated-css.sh

      - name: Upload ids_css artifact
        uses: actions/upload-artifact@v4
        with:
          name: ids_css
          path: ids_css/
          retention-days: 7
          if-no-files-found: warn

  # ── validate (manuális) ──────────────────────────────────────────────────
  validate_ids_styles_tokens:
    name: Validate tokens against ids-styles
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'validate'
    needs: parse_tokens
    environment: validate-ids-styles
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download generated CSS from this run
        uses: actions/download-artifact@v4
        with:
          name: ids_css
          path: ids_css/

      - name: Validate against ids-styles
        env:
          IDS_STYLES_REF: ${{ inputs.ids_styles_ref || vars.IDS_STYLES_REF }}
        run: npm run validate:ids-styles

      - name: Upload token diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-diff-report
          path: token-diff-report.json
          retention-days: 7
          if-no-files-found: warn

  # ── publish (mindig manuális) ────────────────────────────────────────────
  publish_tokens:
    name: Publish CSS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'
    needs: parse_tokens
    environment: publish-tokens
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download ids_css artifact
        uses: actions/download-artifact@v4
        with:
          name: ids_css
          path: ids_css/

      - name: Publish CSS to target repository
        env:
          SKIP_PARSE: "true"
          TARGET_REPO_URL: ${{ secrets.TARGET_REPO_URL || vars.TARGET_REPO_URL }}
          PUBLISH_TARGET_REPO_URL: ${{ inputs.target_repo_url }}
          TARGET_REPO_CREDENTIALS: ${{ secrets.TARGET_REPO_CREDENTIALS }}
          TARGET_REPO_USERNAME: ${{ secrets.TARGET_REPO_USERNAME }}
          TARGET_REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO_BRANCH: ${{ vars.TARGET_REPO_BRANCH }}
          TARGET_CSS_PATH: ${{ vars.TARGET_CSS_PATH }}
          TARGET_CHECKOUT_DIR: ${{ vars.TARGET_CHECKOUT_DIR }}
          TARGET_COMMIT_MESSAGE: ${{ vars.TARGET_COMMIT_MESSAGE }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: npm run publish


