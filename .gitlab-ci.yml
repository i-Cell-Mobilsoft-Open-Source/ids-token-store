workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - foundations/**/*
        - components/**/*
        - parse_ids_css.ts
        - scripts/**/*
        - package.json
        - package-lock.json
        - tsconfig.json
        - .gitlab-ci.yml
    - when: never

stages:
  - parse
  - validate
  - publish

variables:
  IDS_STYLES_REF:
    value: ""
    description: "Token validation only: ids-styles branch, tag or commit SHA. Does not affect publishing."
  PUBLISH_TARGET_REPO_URL:
    value: ""
    description: "Publish only: HTTPS repository URL without credentials. Empty uses TARGET_REPO_URL."

default:
  image: node:22-bookworm
  before_script:
    - npm ci

parse_tokens:
  stage: parse
  script:
    - npm run parse
    - bash scripts/commit-generated-css.sh
  artifacts:
    paths:
      - ids_css/
    expire_in: 7 days

validate_ids_styles_tokens:
  stage: validate
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  allow_failure: false
  script:
    - npm run parse
    - npm run validate:ids-styles
  artifacts:
    when: always
    paths:
      - token-diff-report.json
    expire_in: 7 days

publish_tokens:
  stage: publish
  environment:
    name: publish-tokens
  needs:
    - job: parse_tokens
      artifacts: true
  variables:
    SKIP_PARSE: "true"
  script:
    - npm run publish
  when: manual
  allow_failure: true
